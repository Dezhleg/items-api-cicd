server.port=8080
spring.application.name=items-api
springdoc.swagger-ui.path=/swagger-ui.html

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/itemsdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:itemsuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:itemspass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=false