name: Reusable Docker Build and Push

on:
  workflow_call:
    inputs:
      repository:
        description: 'Docker Hub repository name (username/repo)'
        required: true
        type: string
      tag:
        description: 'Docker image tag'
        required: false
        type: string
        default: 'latest'
      branch:
        description: 'Target branch name to decide push or artifact upload'
        required: true
        type: string
    secrets:
      dockerhub_username:
        required: true
      dockerhub_token:
        required: true

jobs:
  docker-pack-n-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ inputs.repository }}:${{ inputs.tag }}

      - name: Login to Docker Hub (main branch only)
        if: inputs.branch == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Push Docker image to Docker Hub (main branch only)
        if: inputs.branch == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ inputs.repository }}:${{ inputs.tag }}

      - name: Export Docker image to tar archive (non-main branches)
        if: inputs.branch != 'refs/heads/main'
        run: docker save ${{ inputs.repository }}:${{ inputs.tag }} -o image.tar

      - name: Upload Docker image artifact (non-main branches)
        if: inputs.branch != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ inputs.tag }}
          path: image.tar
          retention-days: 5