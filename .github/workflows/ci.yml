name: Distributed WebApp CI & Helm Package

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'bugfix/*'
    paths-ignore:
      - 'docs/**'
      - 'README.md'

jobs:
  build-n-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run unit tests
        run: mvn clean test package

  docker-backend:
    needs: build-n-test
    uses: ./.github/workflows/docker-reusable.yml
    with:
      repository: 'dezhleg2795/items-api'
      tag: 'latest'
      context: '.'
      dockerfile: 'Dockerfile'
      artifact_name: 'docker-items-api'
      branch: ${{ github.ref }}
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  docker-migrator:
    needs: build-n-test
    uses: ./.github/workflows/docker-reusable.yml
    with:
      repository: 'dezhleg2795/items-migrator'
      tag: 'latest'
      context: '.'
      dockerfile: 'Dockerfile.migrator'
      artifact_name: 'docker-items-migrator'
      branch: ${{ github.ref }}
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  docker-frontend:
    uses: ./.github/workflows/docker-reusable.yml
    with:
      repository: 'dezhleg2795/items-frontend'
      tag: 'latest'
      context: './frontend'
      dockerfile: './frontend/Dockerfile'
      artifact_name: 'docker-items-frontend'
      branch: ${{ github.ref }}
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  helm-lint-n-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm Chart
        run: helm lint k8s/webapp -f k8s/webapp/values.lab.yaml --strict

      - name: Package Helm Chart
        run: |
          mkdir -p dist
          helm package k8s/webapp --destination dist

      - name: Upload Helm Chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-webapp
          path: dist/*.tgz
          retention-days: 5