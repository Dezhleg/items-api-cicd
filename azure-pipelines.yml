trigger:
  - main

pool:
  name: 'Default'

variables:
  dockerHubServiceConnection: 'dockerhub-connection'
  imageRepository: '<твой_логин_dockerhub>/items-api'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: 'latest'

stages:
  - stage: BuildAndTest
    displayName: 'Build and Run Unit Tests'
    jobs:
      - job: MavenBuildTest
        displayName: 'Maven Build & Test'
        steps:
          - task: Maven@4
            displayName: 'Build project and run unit tests'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'clean test package'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.17'

  - stage: DockerBuildAndPush
    displayName: 'Build, Tag and Push Docker Image'
    dependsOn: BuildAndTest
    condition: succeeded()
    jobs:
      - job: DockerJob
        displayName: 'Docker Build & Push'
        steps:
          - task: Docker@2
            displayName: 'Build and tag Docker image'
            inputs:
              command: 'build'
              repository: '$(imageRepository)'
              dockerfile: '$(dockerfilePath)'
              tags: |
                $(tag)

          - task: Docker@2
            displayName: 'Push Docker image to Docker Hub'
            inputs:
              command: 'push'
              containerRegistry: '$(dockerHubServiceConnection)'
              repository: '$(imageRepository)'
              tags: |
                $(tag)